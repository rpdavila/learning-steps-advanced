name: Trivy IaC Scan

# This workflow runs Trivy in filesystem mode against infra-terraform/ to detect IaC misconfigurations.
# It is triggered only when infra-terraform/ changes.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'infra-terraform/**'
  pull_request:
    paths:
      - 'infra-terraform/**'

jobs:
  trivy-iac:
    name: Run Trivy IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run Trivy filesystem IaC scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          scan-type: 'fs'
          scan-ref: 'infra-terraform'
          args: '--security-checks config'
          exit-code: '1'
          format: 'table'
          hide-progress: 'true'
