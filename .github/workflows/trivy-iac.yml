name: Trivy IaC Scan

on:
  push:
    paths:
      - 'infra-terraform/**'
  pull_request:
    paths:
      - 'infra-terraform/**'

jobs:
  trivy-iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          scan-type: 'fs'
          scan-ref: 'infra-terraform'
          args: '--security-checks config'
          exit-code: '1'
          format: 'table'
          hide-progress: 'true'
