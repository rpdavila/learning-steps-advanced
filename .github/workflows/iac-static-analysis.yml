name: Terraform Static Analysis

# This workflow runs Terraform static analysis tools on changed infrastructure files.
# It is triggered only when files under infra-terraform/ change.

on:
  push:
    paths:
      - 'infra-terraform/**'
  pull_request:
    paths:
      - 'infra-terraform/**'

jobs:
  tfsec-checkov:
    name: Run tfsec and checkov on Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run tfsec Terraform scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          directory: infra-terraform

      - name: Run checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: infra-terraform
