name: Secret Scan

# This workflow scans the repository for secrets on every push and pull request
# touching source, infrastructure, or workflow files.
# It uses trufflehog filesystem mode and disables entropy-based scanning.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'learningsteps/**'
      - 'infra-terraform/**'
      - 'api/**'
      - '.github/**'
  pull_request:
    paths:
      - 'learningsteps/**'
      - 'infra-terraform/**'
      - 'api/**'
      - '.github/**'

jobs:
  trufflehog:
    name: Run TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install trufflehog
        run: |
          python -m pip install --upgrade pip
          pip install trufflehog

      - name: Run trufflehog filesystem scan
        run: |
          # Scan the repository root for secrets using filesystem mode.
          # --repo_path . sets the scan root, and --entropy false disables entropy-based heuristic.
          trufflehog filesystem --repo_path . --entropy false
