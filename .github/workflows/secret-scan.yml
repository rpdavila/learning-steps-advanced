name: Secret Scan

on:
  push:
    paths:
      - 'learningsteps/**'
      - 'infra-terraform/**'
      - 'api/**'
      - '.github/**'
  pull_request:
    paths:
      - 'learningsteps/**'
      - 'infra-terraform/**'
      - 'api/**'
      - '.github/**'

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install trufflehog
        run: |
          python -m pip install --upgrade pip
          pip install trufflehog

      - name: Run trufflehog secret scan
        run: |
          # run filesystem scan on repository root
          trufflehog filesystem --no-git --entropy=False .
