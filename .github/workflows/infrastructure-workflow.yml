name: Infrastructure CI

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'infra-terraform/**'
  pull_request:
    paths:
      - 'infra-terraform/**'

jobs:
  tfsec-checkov:
    name: Run tfsec and checkov on Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run tfsec Terraform scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          directory: infra-terraform

      - name: Run checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: infra-terraform

  trivy-iac:
    name: Run Trivy IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run Trivy filesystem IaC scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          scan-type: 'fs'
          scan-ref: 'infra-terraform'
          args: '--security-checks config'
          exit-code: '1'
          format: 'table'
          hide-progress: 'true'

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: infra-terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra-terraform
        run: terraform validate || true

      - name: Terraform Plan (write binary plan)
        working-directory: infra-terraform
        run: terraform plan -input=false -out=tfplan

      - name: Save plan JSON
        working-directory: infra-terraform
        run: terraform show -no-color -json tfplan > tfplan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra-terraform/tfplan
            infra-terraform/tfplan.json

  apply:
    name: Terraform Apply
    needs: [plan, tfsec-checkov, trivy-iac]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Download plan artifact (if present)
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra-terraform
        continue-on-error: false

      - name: Terraform Apply (use plan if available)
        working-directory: infra-terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          set -e
          if [ -f tfplan ]; then
            terraform init -input=false
            terraform apply -input=false tfplan
          else
            terraform init -input=false
            terraform plan -input=false -out=tfplan
            terraform apply -input=false tfplan
          fi
