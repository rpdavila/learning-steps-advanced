name: Infrastructure Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - "infra-terraform/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "infra-terraform/**"
  workflow_dispatch:
    inputs:
      terraform_version:
        description: "Terraform version to use"
        required: false
        default: "1.15.8"
        type: string

env:
  WORKING_DIR: infra-terraform
  # Must be >= the version that last wrote the remote state (1.15.8).
  # Terraform refuses to read state written by a newer version.
  TF_VERSION: ${{ inputs.terraform_version || '1.15.8' }}

jobs:
  # ============================================
  # ALWAYS RUNS - No Azure credentials needed
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "${{ env.WORKING_DIR }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend - just download providers)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ============================================
  # CONDITIONAL - Only runs if ENABLE_AZURE_DEPLOY is true
  # Set this in: Repo Settings → Secrets and variables → Actions → Variables
  # ============================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: vars.ENABLE_AZURE_DEPLOY == 'true' && success()
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}
      TF_VAR_tennant_id: ${{ secrets.ARM_TENANT_ID }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Allow this runner through the Key Vault firewall
        run: |
          IP=$(curl -sf --max-time 10 https://api.ipify.org)
          echo "TF_VAR_keyvault_allowed_ip=$IP" >> "$GITHUB_ENV"
          az login --service-principal \
            -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" -t "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          if az keyvault show -n learning-steps-key-vault -g ProjectLearningSteps --output none 2>/dev/null; then
            az keyvault network-rule add -n learning-steps-key-vault \
              -g ProjectLearningSteps --ip-address "$IP" --output none
            sleep 15
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=learningsteps.tfstate"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.ENABLE_AZURE_DEPLOY == 'true'
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}
      TF_VAR_tennant_id: ${{ secrets.ARM_TENANT_ID }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Allow this runner through the Key Vault firewall
        run: |
          IP=$(curl -sf --max-time 10 https://api.ipify.org)
          echo "TF_VAR_keyvault_allowed_ip=$IP" >> "$GITHUB_ENV"
          az login --service-principal \
            -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" -t "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          if az keyvault show -n learning-steps-key-vault -g ProjectLearningSteps --output none 2>/dev/null; then
            az keyvault network-rule add -n learning-steps-key-vault \
              -g ProjectLearningSteps --ip-address "$IP" --output none
            sleep 15
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=learningsteps.tfstate"

      # Re-planned here rather than applying the plan job's artifact: the Key
      # Vault ip_rules are pinned to whichever runner produced the plan, and
      # this job runs on a different runner with a different egress IP.
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan