name: LearningSteps CD
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: rpdavila/learningsteps
          path: learningsteps

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/learningsteps:${{ github.sha }} ./learningsteps

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/learningsteps:${{ github.sha }}
          exit-code: 1
          ignore-unfixed: true

      - name: Push Docker image
        if: success()
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/learningsteps:${{ github.sha }}

      - name: Login with Azure Login
        uses: Azure/Login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID}}
          tenant-id: ${{ secrets.ARM_TENANT_ID}}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID}}
      
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Checkout Kubernetes Manifests
        uses: actions/checkout@v5
        with:
          repository: rpdavila/learning-steps-advanced 
          path: k8s-manifests

      - name: Deploy application
        run: |          
          # set up name space
          kubectl apply -f k8s-manifests/namespace.yaml
          
          # setup secrets
          kubectl apply -f k8s-manifests/secretsproviderclass.yaml

          # setup rbac
          kubectl apply -f k8s-manifests/secrets-store-rbac.yaml
          
          # deploy
          kubectl apply -f  k8s-manifests/deployment.yaml

          # expose service loadblancer
          kubectl apply -f service.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/learningsteps-api \
            -n learningsteps     
      
