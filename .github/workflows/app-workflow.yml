name: App CI and Docker Build

on:
  workflow_dispatch: {}

jobs:
  build:
    name: App build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          repository: YOUR_OWNER/learningsteps

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r ./api/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check ./api

      - name: Run pytest
        run: python -m pytest ./api


  build-scan-push:
    name: Build, scan, and push Docker image
    runs-on: ubuntu-latest
    needs: [build]

    env:
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/learningsteps:${{ github.sha }}

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          repository: YOUR_OWNER/learningsteps

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          ACR_NAME=${{ secrets.ACR_LOGIN_SERVER }}
          az acr login --name "$ACR_NAME"

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          push: false
          tags: ${{ env.IMAGE }}
          context: .
          file: ./Dockerfile

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'

      - name: Push image to ACR
        if: success()
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE }}
          context: .


  secret-scan:
    name: Run secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          repository: YOUR_OWNER/learningsteps

      - name: Install trufflehog
        run: |
          python -m pip install --upgrade pip
          pip install trufflehog

      - name: Run trufflehog filesystem scan
        run: |
          trufflehog filesystem --repo_path . --entropy false
