name: App CI and Docker Build

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'learningsteps/**'
      - 'api/**'
  pull_request:
    paths:
      - 'learningsteps/**'
      - 'api/**'

jobs:
  build:
    name: App build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r ./learningsteps/api/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check ./learningsteps/api

      - name: Run pytest
        run: python -m pytest ./learningsteps/api

  build-scan-push:
    name: Build, scan, and push Docker image
    runs-on: ubuntu-latest
    needs: [build, secret-scan]
    env:
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/learningsteps:${{ github.sha }}
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          ACR_NAME=${{ secrets.ACR_LOGIN_SERVER }}
          az acr login --name "$ACR_NAME"

      - name: Build image (no push)
        uses: docker/build-push-action@v4
        with:
          push: false
          tags: ${{ env.IMAGE }}
          context: ./learningsteps
          file: ./learningsteps/Dockerfile

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          exit-code: '1'

      - name: Push image to ACR
        if: success()
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE }}
          context: ./learningsteps

  secret-scan:
    name: Run secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install trufflehog
        run: |
          python -m pip install --upgrade pip
          pip install trufflehog

      - name: Run trufflehog filesystem scan
        run: |
          trufflehog filesystem --repo_path . --entropy false
