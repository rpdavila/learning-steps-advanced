name: Application CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - "k8s-manifests/**"
      - ".github/workflows/app-pipeline.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "k8s-manifests/**"
  workflow_dispatch:

env:
  IMAGE_NAME: learningsteps-api
  APP_DIR: learningsteps
  K8S_DIR: k8s-manifests
  NAMESPACE: learningsteps

jobs:

  # ==================================================
  # Step 1: Checkout and Security Scan
  # ==================================================
  code-scan:
    name: Scan Application Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout LearningSteps application repository
        uses: actions/checkout@v4
        with:
          repository: rpdavila/learningsteps
          path: learningsteps

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./learningsteps
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH


  # ==================================================
  # Step 2: Build, Scan & Push Docker Image
  # ==================================================
  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: code-scan
name: LearningSteps CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_SERVER }}/learningsteps:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ACR_SERVER }}/learningsteps:${{ github.sha }}
          exit-code: 1
          ignore-unfixed: true

      - name: Push Docker image
        if: success()
        run: |
          docker push ${{ secrets.ACR_SERVER }}/learningsteps:${{ github.sha }}
    steps:

      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout LearningSteps application repository
        uses: actions/checkout@v4
        with:
          repository: rpdavila/learningsteps
          path: learningsteps

      - name: Verify application files
        run: |
          ls -la learningsteps
          ls -la learningsteps/api


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            ./learningsteps

          echo "Image built successfully"


      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}"
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true


      - name: Push image to ACR
        run: |
          docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}


      - name: Save image tag
        run: |
          echo "${{ github.run_number }}" > image_tag.txt


      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt
          retention-days: 1



  # ==================================================
  # Step 3: Configure Kubernetes Access
  # ==================================================
  setup-kubernetes:
    name: Configure Kubernetes Access
    runs-on: ubuntu-latest
    needs: build-scan-push

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:

      - name: Configure kubectl
        run: |
          kubectl config set-cluster aks-cluster \
            --server=${{ secrets.K8S_SERVER }} \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials github-deployer \
            --token=${{ secrets.K8S_TOKEN }}

          kubectl config set-context aks-context \
            --cluster=aks-cluster \
            --user=github-deployer \
            --namespace=${{ env.NAMESPACE }}

          kubectl config use-context aks-context


      - name: Verify access
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} || true



  # ==================================================
  # Step 4: Deploy Application
  # ==================================================
  deploy-to-kubernetes:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: setup-kubernetes
    environment: production


    steps:

      - name: Checkout deployment repository
        uses: actions/checkout@v4


      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag


      - name: Set image tag
        run: |
          echo "IMAGE_TAG=$(cat image_tag.txt)" >> $GITHUB_ENV


      - name: Configure kubectl
        run: |
          kubectl config set-cluster aks-cluster \
            --server=${{ secrets.K8S_SERVER }} \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials github-deployer \
            --token=${{ secrets.K8S_TOKEN }}

          kubectl config set-context aks-context \
            --cluster=aks-cluster \
            --user=github-deployer \
            --namespace=${{ env.NAMESPACE }}

          kubectl config use-context aks-context



      - name: Deploy manifests
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

        run: |

          sed \
          "s|image:.*learningsteps-api:.*|image: ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}|g" \
          ${{ env.K8S_DIR }}/deployment.yaml \
          | kubectl apply -n ${{ env.NAMESPACE }} -f -

          kubectl apply \
          -n ${{ env.NAMESPACE }} \
          -f ${{ env.K8S_DIR }}/service.yaml



  # ==================================================
  # Step 5: Verify Deployment
  # ==================================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-to-kubernetes


    steps:

      - name: Verify rollout
        run: |
          kubectl rollout status \
          deployment/learningsteps-api \
          -n ${{ env.NAMESPACE }}


      - name: Check pods
        run: |
          kubectl get pods \
          -n ${{ env.NAMESPACE }}


      - name: Check service
        run: |
          kubectl get svc \
          -n ${{ env.NAMESPACE }}


      - name: Success
        run: |
          echo "Deployment completed successfully"